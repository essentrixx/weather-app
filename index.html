<!DOCTYPE html><html lang="en"><head>    <meta charset="UTF-8">    <meta name="viewport" content="width=device-width, initial-scale=1">    <title>Weather Application</title>    <link rel="stylesheet" href="style.css" type="text/css" /></head><body>    <div class="card">        <div class="search">            <input type="text" name="" id="" class="search-input" placeholder="Enter city name" spellcheck="false" autocomplete="off" />            <button class="search-btn"><img src="./images/search.png" alt="searching"></button>        </div>        <div class="error">            <p>Invalid city name</p>        </div>        <div class="weather">            <img src="images/rain.png" class="weather-icon" alt="rain" />            <h1 class="temp">--&deg;C</h1>            <h2 class="city">New York</h2>            <div class="details">                <div class="col">                    <img src="images/humidity.png" alt="humidity">                    <div>                        <p class="humidity">50%</p>                        <p>Humidity</p>                    </div>                </div>                <div class="col">                    <img src="images/wind.png" alt="wind">                    <div>                        <p class="wind">15 km</p>                        <p>Wind Speed</p>                    </div>                </div>            </div>        </div>    </div>    <script>        const apiKey = "26553c7d816c6af309482eb67a4e4c22";        const searchInput = document.querySelector(".search-input");        const searchBtn = document.querySelector(".search-btn");        const weatherIcon = document.querySelector(".weather-icon");        async function checkWeather(city) {            const apiUrl = `https://api.openweathermap.org/data/2.5/weather?units=metric&q=${city}&appid=${apiKey}`;            try {                const response = await fetch(apiUrl);                if (response.status === 404) {                    // throw new Error(response.statusText);                    document.querySelector(".error").style.display = "block";                    document.querySelector(".weather").style.display = "none";                }                const data = await response.json();                console.log(data);  // got object in browser console                document.querySelector(".city").innerHTML = data.name;                document.querySelector(".temp").innerHTML = Math.round(data.main.temp) + '&deg;C';                document.querySelector(".humidity").innerHTML = data.main.humidity + '%';                document.querySelector(".wind").innerHTML = data.wind.speed + ' km/h';                if (data.weather[0].main == "Clouds") {                    weatherIcon.src = "images/clouds.png";                } else if (data.weather[0].main == "Rain") {                    weatherIcon.src = "images/rain.png";                } else if (data.weather[0].main == "Clear") {                    weatherIcon.src = "images/clear.png";                } else if (data.weather[0].main == "Drizzle") {                    weatherIcon.src = "images/drizzle.png";                } else if (data.weather[0].main == "Mist"){                    weatherIcon.src = "images/mist.png";                }                document.querySelector(".weather").style.display = "block";                document.querySelector(".error").style.display = "none";            }            catch(err) {                console.log(err.message);            }        }        searchBtn.addEventListener("click", () => {            checkWeather(searchInput.value);    // Call checkWeather with the entered city        });    </script></body></html>
